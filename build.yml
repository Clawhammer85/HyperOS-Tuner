name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE != '' && secrets.SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel bereitstellen
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/klappwetter.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/klappwetter.p12" >> "$GITHUB_ENV"

      - name: Hinweis ohne Signaturschlüssel
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::Kein Signaturschlüssel hinterlegt – APK wird mit Debug-Schlüssel signiert. Updates erfordern dann eine Neuinstallation (siehe README)."

      - name: APK bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace -PcontactUrl="${{ github.server_url }}/${{ github.repository }}"

      - name: APK umbenennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Klappwetter-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Klappwetter-APK
          path: out/*.apk
